<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="100%" height="100%" aria-label="Veli Sigorta Logo">
  <defs>
    <!-- Chrome Gradient 1 -->
    <linearGradient id="chrome1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="25%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <!-- Blue Metallic Gradient -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <!-- Dark Blue Gradient for Sigorta Text -->
    <linearGradient id="darkBlueText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <!-- Sphere Gradient -->
    <radialGradient id="sphereGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#CBD5E1"/>
      <stop offset="80%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
  </defs>

  <!-- V Emblem Group -->
  <g id="V-Emblem" transform="translate(15, 15)">
    <!-- Outer Metallic V Outer Left -->
    <path d="M 10 15 L 65 140 C 70 150, 75 150, 80 140 L 135 15 L 115 15 L 72 110 L 30 15 Z" fill="url(#chrome1)" stroke="#334155" stroke-width="0.5"/>
    
    <!-- Inner Blue Arc V -->
    <path d="M 45 25 C 60 70, 70 100, 75 115 C 80 100, 95 60, 115 25 L 100 25 C 88 55, 78 85, 75 95 C 72 85, 58 50, 45 25 Z" fill="url(#blueGradient)"/>

    <!-- Accent Dot / Sphere -->
    <circle cx="120" cy="12" r="9" fill="url(#sphereGrad)" stroke="#64748B" stroke-width="0.5"/>
  </g>

  <!-- Typography Group -->
  <g id="Logo-Typography" transform="translate(170, 20)">
    <!-- VELI Text -->
    <text x="0" y="55" font-family="'Cinzel', 'Times New Roman', serif" font-size="52" font-weight="800" letter-spacing="6" fill="url(#chrome1)" stroke="#334155" stroke-width="0.5">
      VELİ
    </text>
    
    <!-- SİGORTA Text -->
    <text x="0" y="105" font-family="'Cinzel', 'Times New Roman', serif" font-size="42" font-weight="900" letter-spacing="8" fill="url(#darkBlueText)">
      SİGORTA
    </text>

    <!-- Top Rule -->
    <line x1="0" y1="120" x2="310" y2="120" stroke="#94A3B8" stroke-width="1.2"/>

    <!-- Subtitle Domain -->
    <text x="155" y="138" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="3" fill="#475569" text-anchor="middle">
      velisigorta.com.tr
    </text>

    <!-- Bottom Rule -->
    <line x1="0" y1="148" x2="310" y2="148" stroke="#CBD5E1" stroke-width="0.8"/>
  </g>
</svg>
